services:

  # ── Modo desarrollo (hot-reload) ─────────────────────────────
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules      # evita sobrescribir node_modules del host
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - NODE_ENV=development

  # ── Modo producción (Nginx compilado) ────────────────────────
  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
